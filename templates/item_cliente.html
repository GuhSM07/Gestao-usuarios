<tr id="cliente-{{ cliente.id }}">
    <th scope="row">{{ cliente.id }}</th>
    <td>{{ cliente.nome }}</td>
    <td>{{ cliente.email }}</td>
    <td>
        <a href="{{ url_for('cliente.detalhes_cliente', cliente_id=cliente.id) }}" 
           class="btn btn-secondary" style="font-size: 12px; padding: 5px 10px;">
            Ver
        </a>
        <a href="{{ url_for('cliente.editar_cliente', cliente_id=cliente.id) }}" 
           class="btn btn-primary" style="font-size: 12px; padding: 5px 10px;">
            Editar
        </a>
        <form method="POST" action="{{ url_for('cliente.deletar_cliente', cliente_id=cliente.id) }}" 
              style="display: inline;"
              onsubmit="return confirm('Tem certeza que deseja deletar {{ cliente.nome }}?');">
            <input type="hidden" name="_method" value="DELETE">
            <button type="submit" class="btn btn-danger" style="font-size: 12px; padding: 5px 10px; border: none; cursor: pointer;">
                Deletar
            </button>
        </form>
    </td>
</tr>
