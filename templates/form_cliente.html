{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto;">
    <h2>{% if cliente %}Editar{% else %}Novo Cliente{% endif %}</h2>
    
    <form method="POST" 
          action="{% if cliente %}{{ url_for('cliente.atualizar_cliente', cliente_id=cliente.id) }}{% else %}{{ url_for('cliente.form_cliente') }}{% endif %}"
          style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
        <div class="mb-3">
            <label class="form-label">Vulgo</label>
            <input type="text" class="form-control" name="nome" 
                   {% if cliente %}value="{{ cliente.nome }}"{% endif %}
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" 
                   {% if cliente %}value="{{ cliente.email }}"{% endif %}
                   required>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-success" style="flex: 1;">
                {% if cliente %}💾 Salvar{% else %}✅ Adicionar{% endif %}
            </button>
            <a href="{{ url_for('cliente.listar_cliente') }}" class="btn btn-secondary" style="flex: 1; text-decoration: none; text-align: center;">
                ❌ Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
