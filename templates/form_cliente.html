<form class="c-form" 
  {% if cliente %}
    action="{{ url_for('cliente.atualizar_cliente', cliente_id=cliente.id) }}"
  {% else %}
    action="{{ url_for('cliente.inserir_cliente') }}"
  {% endif %}
  method="{% if cliente %}PUT{% else %}POST{% endif %}"
  
  {% if cliente %}
  c-swap="#cliente-{{cliente.id}}"
  {% else %}
  c-append="#lista_clientes"
  {% endif %}
  
  c-reload-container="True">
  
  <div class="mb-3">
    <label class="form-label">Nome</label>
    <input type="text" class="form-control" aria-describedby="emailHelp" name="nome" {% if cliente %}value="{{cliente.nome}}"{% endif %}>
    <div id="emailHelp" class="form-text">digite seu nome de usuario</div>
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="text" class="form-control" aria-describedby="emailHelp" name="email" {% if cliente %} value="{{cliente.email}}" {% endif %}>
    <div id="emailHelp" class="form-text">digite seu Email</div>
  </div>

  <!-- <div class="mb-3">    
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div> -->

  <button type="submit" class="btn btn-success">
    {% if cliente %} 
    Salvar
    {% else %}
    Adicionar
    {% endif %}
    </button>
</form>
