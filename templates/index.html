{% extends "base.html" %}

{% block content %}
<div class="container" style="margin: 40px auto;">
    <div class="dashboard-container">
        <h1 style="text-align: center; margin-bottom: 40px;">🎮 Sistema de Gestão ⚙️</h1>
        
        <div class="dashboard-grid">
            <!-- Card Torneios -->
            <div class="dashboard-card">
                <div class="card-icon">⚔️</div>
                <h2>Gerenciar Torneios</h2>
                <p>Crie, organize e acompanhe torneios com confrontos por chaveamento</p>
                <a href="{{ url_for('torneio.listar_torneios') }}" class="btn btn-primary btn-block">Ir para Torneios</a>
            </div>

            <!-- Card Clientes -->
            <div class="dashboard-card">
                <div class="card-icon">👥</div>
                <h2>Gerenciar Clientes</h2>
                <p>Gerencie informações de clientes e participantes</p>
                <a href="{{ url_for('cliente.listar_cliente') }}" class="btn btn-secondary btn-block">Ir para Clientes</a>
            </div>
        </div>
    </div>
</div>

<style>
    .dashboard-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
    }

    .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
        margin-top: 30px;
    }

    .dashboard-card {
        background: white;
        border: 2px solid #ddd;
        border-radius: 12px;
        padding: 30px;
        text-align: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .dashboard-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        border-color: #007bff;
    }

    .card-icon {
        font-size: 3em;
        margin-bottom: 15px;
    }

    .dashboard-card h2 {
        color: #333;
        margin: 15px 0;
        font-size: 1.5em;
    }

    .dashboard-card p {
        color: #666;
        font-size: 0.95em;
        margin: 15px 0 25px 0;
        line-height: 1.5;
    }

    .btn-block {
        width: 100%;
        padding: 12px 20px;
        font-size: 1em;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        display: block;
        transition: all 0.3s ease;
    }

    .btn-primary {
        background: #007bff;
        color: white;
    }

    .btn-primary:hover {
        background: #0056b3;
    }

    .btn-secondary {
        background: #6c757d;
        color: white;
    }

    .btn-secondary:hover {
        background: #545b62;
    }
</style>
{% endblock %}
